<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UXR Level-Up Lab</title>
<meta name="description" content="Built based on analysis of 50 verified North American mid-senior UXR job postings (Oct 2026).">
<style>
@font-face{font-family:"Geist Sans";font-style:normal;font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/fontsource/fonts/geist-sans@latest/latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Geist Sans";font-style:normal;font-weight:500;font-display:swap;src:url("https://cdn.jsdelivr.net/fontsource/fonts/geist-sans@latest/latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Geist Sans";font-style:normal;font-weight:600;font-display:swap;src:url("https://cdn.jsdelivr.net/fontsource/fonts/geist-sans@latest/latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Geist Sans";font-style:normal;font-weight:700;font-display:swap;src:url("https://cdn.jsdelivr.net/fontsource/fonts/geist-sans@latest/latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/fontsource/fonts/geist-mono@latest/latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:500;font-display:swap;src:url("https://cdn.jsdelivr.net/fontsource/fonts/geist-mono@latest/latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:600;font-display:swap;src:url("https://cdn.jsdelivr.net/fontsource/fonts/geist-mono@latest/latin-600-normal.woff2") format("woff2")}
:root{
 --font-sans:"Geist Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
 --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root{
  --bg:#faf7f1; --card:#ffffff; --ink:#2c2620; --muted:#8a7f72; --line:#ece4d8;
  --accent:#e8365d; --accent-soft:#fdeef2;
  --lv0:#b7b0c9; --lv1:#43b581; --lv2:#f2994a; --lv3:#f2c94c;
  --radius:16px; --shadow:0 6px 24px rgba(60,40,20,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);
  line-height:1.6}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(250,247,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-right:auto}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.heroesub{border-bottom:1px solid var(--line);background:rgba(255,255,255,.55)}
.heroesub .wrap{padding-top:10px;padding-bottom:10px}
.heroesub span{font-size:13px;color:var(--muted)}
.seg{display:flex;background:#f1e9dd;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);font-weight:600}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:15px;height:15px}
/* ---------- banners ---------- */
.banner{display:none;margin:12px auto 0;max-width:1180px;padding:10px 16px;border-radius:12px;font-size:13.5px}
.banner.show{display:block}
#demoBanner{background:#fff7e8;border:1px solid #f0dcae;color:#7a5b16}
#storeBanner{background:#fdeaea;border:1px solid #f3b8b8;color:#8f1d1d}
.banner .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:0}
/* ---------- cards & grid ---------- */
.grid{display:grid;grid-template-columns:1fr 380px;gap:16px;margin:16px auto 40px;max-width:1180px;padding:0 18px}
.grid .full{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 svg{width:18px;height:18px;color:var(--accent)}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
/* ---------- progress ---------- */
.pstats{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.pstat b{font-size:26px}
.pstat span{font-size:12px;color:var(--muted);display:block}
.stagechip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px}
.mbar{height:10px;background:#f1e9dd;border-radius:99px;overflow:hidden;margin-top:8px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff7a93);border-radius:99px;transition:width .5s}
.branchbars{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.bbar{font-size:12.5px}
.bbar .row{display:flex;justify-content:space-between;margin-bottom:3px}
.bbar .tr{height:7px;background:#f4eee4;border-radius:99px;overflow:hidden}
.bbar .tr i{display:block;height:100%;border-radius:99px}
/* ---------- tree svg ---------- */
#treeWrap{position:relative}
#treeSvg{width:100%;height:auto;display:block;border-radius:12px;background:linear-gradient(#eaf4ff 0%,#f7fbff 55%,#fdf6ec 100%)}
.tnode{cursor:pointer}
.tnode:hover .leafbody{stroke-width:2.8}
.tnode circle{stroke:#fff;stroke-width:2.5;transition:transform .15s}
.tnode:hover circle{stroke-width:4}
.tnode text{font-size:10px;fill:#6b6156;text-anchor:middle;pointer-events:none}
.blabel{font-size:12px;font-weight:700;fill:#5c5348}
/* ---------- list view ---------- */
.brcard{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.brhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fbf8f3;cursor:pointer}
.brhead .sw{width:12px;height:12px;border-radius:4px}
.brhead b{font-size:14px}
.brhead .avg{margin-left:auto;font-size:12px;color:var(--muted)}
.brbody{padding:6px 10px 10px;display:none}
.brcard.open .brbody{display:block}
.srow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px dashed var(--line);cursor:pointer}
.srow:hover{background:#fdfaf5}
.srow .nm{flex:1;font-size:13.5px}
.srow .dm{font-size:11.5px;color:var(--muted);min-width:44px;text-align:right}
.lvdot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dbar{width:64px;height:6px;background:#f1e9dd;border-radius:99px;overflow:hidden;flex:none}
.dbar i{display:block;height:100%;background:#c9a86a}
/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(40,30,20,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:#fffdf9;z-index:90;
  transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
#drawer.show{transform:none}
#drawer .dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#drawer .dhead .tt{flex:1}
#drawer .dhead h3{margin:0;font-size:17px}
#drawer .dhead .meta{font-size:12px;color:var(--muted);margin-top:2px}
#drawer .dbody{overflow-y:auto;padding:16px 18px;flex:1}
.dsec{margin-bottom:18px}
.dsec h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lvbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvbtn{border:2px solid var(--line);border-radius:12px;padding:9px;background:#fff;text-align:left;font-size:13px}
.lvbtn b{display:flex;align-items:center;gap:7px;font-size:13.5px}
.lvbtn small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px;line-height:1.4}
.lvbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.lvbtn .cdot{width:12px;height:12px;border-radius:50%;display:inline-block}
textarea,input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:13.5px}
textarea{min-height:76px;resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.resitem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:13px;background:#fff}
.resitem .tp{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.resitem small{color:var(--muted);display:block}
.tl{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px}
.tl .ev{font-size:12.5px;margin-bottom:10px;position:relative}
.tl .ev:before{content:"";position:absolute;left:-20.5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl .ev time{color:var(--muted);font-size:11px;display:block}
/* ---------- generic list rows ---------- */
.gaprow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.gaprow:first-of-type{border-top:0}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag.hi{background:#fde7ec;color:#c2254d}.tag.mh{background:#fff3df;color:#b26a00}.tag.md{background:#eef4ff;color:#2f5fc2}.tag.lo{background:#f1f1f1;color:#777}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{margin:0 0 12px}
.frow{margin-bottom:12px}
.frow label{font-size:12.5px;font-weight:700;display:block;margin-bottom:5px}
.frow small{color:var(--muted);font-size:11.5px}
.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px}
/* ---------- misc ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ddbanner{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:linear-gradient(90deg,#fff7ed,#fef3c7);border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px;color:#7c2d12}
.ddbanner b{font-size:15px}
.ddbanner .ddn{margin-left:auto;font-weight:700;color:#92400e;white-space:nowrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kbd{font-size:11px;background:#f4eee4;border-radius:6px;padding:1px 7px;color:var(--muted)}
.foot{border-top:1px solid var(--line);margin-top:30px;padding:22px 0 46px;color:var(--muted);font-size:12.5px}
.foot .wrap p{margin:4px 0}
.score{font-size:34px;font-weight:800;color:var(--accent)}
.star3{display:grid;gap:8px}
.star3 label{font-size:12px;font-weight:700}
.privnote{font-size:11.5px;color:var(--muted)}
body.public .priv{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .branchbars{grid-template-columns:1fr}
}
@media(max-width:768px){
  #drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:88vh;border-radius:20px 20px 0 0;transform:translateY(105%);border-left:0;border-top:1px solid var(--line)}
  #drawer.show{transform:none}
  .pstats{gap:12px}
  .card{padding:14px}
  .drow{grid-template-columns:1fr}
}
/* ---- tree metaphor: leaves, glow, halo ---- */
.tnode{cursor:pointer}
.tnode .eglow{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.16}50%{opacity:.5}}
.tnode .halo{animation:halopulse 2s ease-in-out infinite}
@keyframes halopulse{0%,100%{opacity:.45}50%{opacity:1}}
.tnode.pulse .leafbody{animation:nodepulse 1s ease-in-out infinite}
@keyframes nodepulse{50%{opacity:.5}}
.tnode.flash .leafbody{animation:nodeflash .45s ease-in-out 3}
@keyframes nodeflash{50%{opacity:.25}}
.blabel{font-size:13px;fill:#6b6156;text-anchor:middle;font-weight:600}
.rootlabel{font-size:12px;fill:#6b5b45;text-anchor:middle;font-weight:600}
/* ---- double diamond view ---- */
#ddTreeWrap svg{width:100%;height:auto;display:block}
.ddsub{color:var(--muted);font-size:13px;margin:2px 0 4px}
.dgroup{margin:14px 0}
.dlabel{font-weight:700;margin-bottom:8px;font-size:15px}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phasecard{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px;transition:opacity .25s,box-shadow .25s;margin-bottom:12px}
.phasecard.dim{opacity:.38}
.phasecard.flash{box-shadow:0 0 0 3px #f2b705;animation:nodeflash .45s ease-in-out 3}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pdia{width:26px;height:26px;transform:rotate(45deg);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pdia b{transform:rotate(-45deg);color:#fff;font-size:13px}
.ptagline{color:var(--muted);font-size:12.5px}
.pgoal{font-size:13.5px;margin:8px 0;color:#4a4438}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ptag{border:1px solid var(--line);background:#fbf9f4;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ptag:hover{border-color:var(--accent)}
.ptag .lvdt{width:8px;height:8px;border-radius:50%;flex:none}
.ptag.static{cursor:default}
.pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.pbar{flex:1;min-width:90px;height:7px;background:#f1ece1;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#7cb86b,#2f9e44);border-radius:99px}
.proofbtn{border:1px dashed var(--accent);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--accent)}
.prooflist{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.prooflist li{padding:6px 0;border-top:1px dashed var(--line);cursor:pointer;color:#4a4438}
.prooflist li:hover{color:var(--accent)}
.parts{font-size:12.5px;color:var(--muted);margin-top:8px}
.parts b{color:#4a4438}
#ddAlert{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.6}
#ddAlert.good{background:#edf7ee;border:1px solid #bfe3c4;color:#1e6b34}
#ddAlert.warn{background:#fff8e6;border:1px solid #f2d38a;color:#8a5a00}
.stationrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
/* ---- double diamond canvas ---- */
.ddtoolbar{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin:2px 0 8px;flex-wrap:wrap}
.qscan{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.qscan input{accent-color:#e11d48}
.canvaswrap{position:relative;margin:4px 0 0}
#ddCanvas{width:100%;height:auto;display:block}
.canvaswrap .quad{cursor:pointer;transition:opacity .25s}
.canvaswrap .quad:hover{opacity:.08}
.canvaswrap .quad.lit{opacity:.13}
.canvaswrap .conn{fill:none;stroke:#e11d48;stroke-width:2.5;stroke-dasharray:6 5;opacity:0;transition:opacity .3s}
.canvaswrap .conn.lit{opacity:.9}
.qpill{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1.5px solid #f3b3c0;border-radius:12px;padding:8px 12px;box-shadow:0 4px 18px rgba(225,29,72,.18);cursor:pointer;text-align:left;min-width:120px;z-index:2}
.qpill b{font-size:12.5px;color:#1f1b14;display:block;font-weight:600}
.qpill b i{color:#e11d48;font-style:normal;margin-right:4px}
.qpill .pbar{display:block;height:5px;background:#f1ece1;border-radius:99px;margin:6px 0;overflow:hidden}
.qpill .pbar i{display:block;height:100%;background:#e11d48;border-radius:99px}
.qpill .pcase{font-size:12px;color:#6b6156}
.qpill:hover{box-shadow:0 4px 24px rgba(225,29,72,.38)}
.qcloud{position:absolute;transform:translate(-50%,-50%);width:19%;display:flex;flex-wrap:wrap;gap:2px 7px;justify-content:center;align-content:center;z-index:1}
.mword{font-size:11px;line-height:1.45;color:#3a352c;cursor:pointer}
.mword.off{color:#c0b9a8;opacity:.6}
.mword.mid{color:#8a8478}
.mword.on{color:#1f1b14;font-weight:600}
.mword .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e11d48;margin-right:4px;box-shadow:0 0 6px #e11d48}
.mword.art{cursor:default;color:#6b6156;font-style:italic}
.fdrunway{margin:10px 0 4px;background:#f4f1ea;border:1px solid #e5e0d2;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fdlabel{font-size:11.5px;font-weight:700;letter-spacing:1.5px;color:#8a8478}
.fditem{font-size:13px;background:#fff;border:1px solid #e5e0d2;border-radius:999px;padding:4px 12px;cursor:pointer;transition:border-color .2s,color .2s}
.fditem:hover{border-color:#e11d48;color:#e11d48}
.covlist{margin:8px 0}
.crow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px;cursor:pointer}
.crow:hover{color:var(--accent)}
.crow .dm{margin-left:auto;color:var(--muted);font-size:12.5px;flex:none}
/* ---- double diamond: SaaS board ---- */
.ddlegend{margin:2px 0 4px}
.ddlegend svg{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.ddgrid{display:grid;grid-template-columns:1fr;gap:14px;margin:10px 0}
@media(min-width:760px){.ddgrid{grid-template-columns:1fr 1fr}}
@media(min-width:1120px){.ddgrid{grid-template-columns:repeat(4,1fr)}}
.dcol{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .18s ease,box-shadow .18s ease;display:flex;flex-direction:column}
.dcol:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.09)}
.dcol.flash{box-shadow:0 0 0 3px #f59e0b}
.dcolhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dcolnum{font-size:11.5px;font-weight:700;color:#94a3b8;letter-spacing:1.2px;font-family:var(--font-mono)}
.dcolname{font-size:14px;font-weight:600;color:#0f172a;text-transform:uppercase;letter-spacing:.05em}
.dcolmode{font-size:12px;color:#64748b}
.dcoltags{font-size:12px;color:#94a3b8;margin-top:3px}
.dcolpos{font-size:12px;color:#64748b;margin:8px 0 4px}
.spills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.spill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:-.01em;line-height:1.25;border:1px solid #e2e8f0;background:#f8fafc;color:#334155;cursor:pointer;transition:transform .15s,box-shadow .15s}
.spill:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(15,23,42,.12)}
.spill .sdot{width:8px;height:8px;border-radius:50%;flex:none;background:#cbd5e1}
.spill.lv1{background:#f1f5f9;border-color:#cbd5e1}
.spill.lv1 .sdot{background:#93c5fd}
.spill.lv2{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}

function branchPath(i,n){
  const rad=(-66+i*22)*Math.PI/180, pts=[];
  for(let k=0;k<=10;k++){const tt=k/10*1.02, r=70+tt*300;
    pts.push([460+Math.sin(rad)*r, 340-Math.cos(rad)*r*0.92]);}
  return "M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
}
function nodePos(i,j,n){
  const rad=(-66+i*22)*Math.PI/180;
  const tt=n===1?0.55:(0.16+0.74*j/(n-1)), r=70+tt*300;
  return [460+Math.sin(rad)*r, 340-Math.cos(rad)*r*0.92+(j%2?11:-11)];
}

function leafSVG(x,y,L,s,hl){
  const cx=x.toFixed(1),cy=y.toFixed(1);
  const ang=(Math.atan2(y-340,x-460)*180/Math.PI+90).toFixed(0);
  const ar=ang*Math.PI/180, vx=(x-7*Math.cos(ar)).toFixed(1), vy=(y-7*Math.sin(ar)).toFixed(1);
  const wx=(x+7*Math.cos(ar)).toFixed(1), wy=(y+7*Math.sin(ar)).toFixed(1);
  const rot=`rotate(${ang} ${cx} ${cy})`;
  const vein=`<line x1="${vx}" y1="${vy}" x2="${wx}" y2="${wy}"`;
  const target=(S.sprint.targets||[]).some(tg=>tg.skill===s.id);
  const glow=(c,r)=>`<circle class="eglow" cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`;
  let body="";
  if(L===0){
    body=`<ellipse class="leafbody" cx="${cx}" cy="${cy}" rx="11" ry="7" transform="${rot}" fill="#faf8f3" stroke="#c9c2b4" stroke-width="1.6"/>${vein} stroke="#ddd6c4" stroke-width="1"/>`;
  }else if(L===1){
    body=`<ellipse class="leafbody" cx="${cx}" cy="${cy}" rx="11" ry="7" transform="${rot}" fill="#b8e0a8" stroke="#7cb86b" stroke-width="1.4"/>${vein} stroke="#8fc47f" stroke-width="1"/>`;
  }else if(L===2){
    body=`${glow("#2f9e44",17)}<ellipse class="leafbody" cx="${cx}" cy="${cy}" rx="12" ry="7.6" transform="${rot}" fill="#2f9e44" stroke="#1e7a32" stroke-width="1.4"/>${vein} stroke="#a9dba8" stroke-width="1"/>`;
  }else{
    body=`${glow("#f2b705",19)}<ellipse class="leafbody" cx="${cx}" cy="${cy}" rx="13" ry="8.4" transform="${rot}" fill="#f2b705" stroke="#d19a06" stroke-width="1.6"/>${vein} stroke="#ffe08a" stroke-width="1.1"/><circle cx="${(x+9).toFixed(1)}" cy="${(y-9).toFixed(1)}" r="5.5" fill="#e8590c" stroke="#c2430a" stroke-width="1.2"/>`;
  }
  const halo=target?`<circle class="halo" cx="${cx}" cy="${cy}" r="21" fill="none" stroke="#f2b705" stroke-width="2" stroke-dasharray="5 4"/>`:"";
  const dim=hl&&s.ph!==hl?0.22:1, pulse=hl&&s.ph===hl?" pulse":"";
  return `<g class="tnode${pulse}" data-id="${s.id}" data-ph="${s.ph}" opacity="${dim}">${halo}<title>${esc(skName(s))} · ${esc(lvName(L))} · ${s.dem}%</title>${body}</g>`;
}

let lastDrop=null;
const AI_SYS="You are a UXR skill librarian. Skills: "+SKILLS.map(s=>s.id+"="+s.en).join("; ")+
 ". Given a learning note or project retro (Chinese or English), return ONLY compact JSON: "+
 "{\"points\":[3 key takeaways as strings],\"skill_id\":<best matching skill id 1-47>,\"suggested_level\":<1|2|3>,\"rationale\":\"one sentence\"}. No markdown, no extra text.";
async function aiExtract(text){
  try{
    const r=await fetch(S.api.endpoint,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.api.key},
      body:JSON.stringify({model:S.api.model||"gpt-4o-mini",
        messages:[{role:"system",content:AI_SYS},{role:"user",content:text}],temperature:0.2})});
    if(!r.ok)return null;
    const j=await r.json();
    const c=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
    const m=c.match(/\{[\s\S]*\}/);
    if(!m)return null;
    const o=JSON.parse(m[0]);
    if(!o.skill_id||!sk(o.skill_id))return null;
    return {points:(o.points||[]).slice(0,3),skillId:o.skill_id,
      to:Math.min(3,Math.max(1,o.suggested_level|0||2)),rationale:o.rationale||""};
  }catch(e){return null;}
}
function ruleExtract(text){
  const low=text.toLowerCase(), scores=SKILLS.map(s=>{
    let h=0;s.kw.forEach(k=>{if(k&&low.includes(k.toLowerCase()))h++;});return {s,h};});
  scores.sort((a,b)=>b.h-a.h);
  const best=scores[0].h>0?scores[0].s:sk(3);
  const cur=lv(best.id);
  const sents=text.split(/[。！？\n.!?]+/).map(x=>x.trim()).filter(x=>x.length>3).slice(0,3);
  return {points:sents.length?sents:[text.slice(0,120)],skillId:best.id,
    to:Math.min(3,cur+1),rationale:t("ruleUsed"),_rule:true};
}

/* ---------------- JD fit & gap scanner ---------------- */
function kwMatch(text){
  const low=text.toLowerCase();
  return SKILLS.map(s=>{let h=0;s.kw.forEach(k=>{if(k&&low.includes(k.toLowerCase()))h++;});return {s,h};})
   .filter(x=>x.h>0).sort((a,b)=>(b.h*b.s.dem)-(a.h*a.s.dem));
}
async function aiJDParse(text){
  try{
    const sys="You are a UXR skill librarian. Skills: "+SKILLS.map(s=>s.id+"="+s.en).join("; ")+
     ". Given a job description, return ONLY compact JSON {\"skill_ids\":[matching skill ids]}. No markdown.";
    const r=await fetch(S.api.endpoint,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.api.key},
      body:JSON.stringify({model:S.api.model||"gpt-4o-mini",
        messages:[{role:"system",content:sys},{role:"user",content:text.slice(0,6000)}],temperature:0.1})});
    if(!r.ok)return null;
    const j=await r.json();
    const c=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
    const m=c.match(/\{[\s\S]*\}/);if(!m)return null;
    const ids=(JSON.parse(m[0]).skill_ids||[]).filter(id=>sk(id));
    return [...new Set(ids)].map(id=>({s:sk(id),h:2}));
  }catch(e){return null;}
}

  if(!text){$("jdResult").innerHTML=`<p class="sub">${esc(t("jdNoText"))}</p>`;return;}

  let matched=S.api.key?(await aiJDParse(text))||kwMatch(text):kwMatch(text);
